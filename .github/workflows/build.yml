name: Check if frontend can be built

on:
  push:
    branches: [project2]
  pull_request:
    branches: [project2]

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v1

      - name: Install dependencies
        run: npm install
        working-directory: frontend/
      - name: Build
        run: npm run build
        working-directory: frontend/
